name: kmep
description: >
  KMEP — a YouTube extraction library for Dart: InnerTube multi-client
  fallback, on-device player.js execution for signature/n resolution,
  on-device PO token (BotGuard) generation, search, shorts feed,
  channels, playlists and comments. Public API is the Kmep facade
  class (see lib/kmep.dart). Pre-1.0, API not yet stable — see
  CHANGELOG.md.
version: 0.3.0
publish_to: 'none'
homepage: https://github.com/dipodev20/kmep
repository: https://github.com/dipodev20/kmep

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.2.0
  # flutter_js убран отсюда: этот пакет должен оставаться чистым Dart
  # (dart pub get / dart test / diagnostic tool должны работать без Flutter
  # SDK). Конкретная реализация JsRuntime на flutter_js — в
  # flutter_integration/, подключается на шаге интеграции в само
  # Flutter-приложение Vidora, где Flutter SDK уже есть.

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
