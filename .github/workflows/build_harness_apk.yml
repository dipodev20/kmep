name: Build harness APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get (dart package)
        working-directory: dart
        run: flutter pub get

      - name: Pub get (harness)
        working-directory: kmep_harness
        run: flutter pub get

      - name: Build APK
        working-directory: kmep_harness
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kmep-proto-harness-apk
          path: kmep_harness/build/app/outputs/flutter-apk/app-release.apk
